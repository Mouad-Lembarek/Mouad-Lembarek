<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .client { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #CBD5E1; }
      .dot { fill: #7C3AED; }
    </style>
    <clipPath id="clip">
      <rect x="0" y="0" width="900" height="70" rx="18"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="900" height="70" rx="18" fill="#0B1220"/>

  <g clip-path="url(#clip)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                         from="0,0" to="-950,0" dur="18s" repeatCount="indefinite"/>
      <!-- sequence 1 -->
      <g transform="translate(30,42)">
        <circle class="dot" cx="-14" cy="-5" r="3"/><text class="client" x="0" y="0">LE MATIN</text>
        <circle class="dot" cx="126" cy="-5" r="3"/><text class="client" x="140" y="0">CFJJB France</text>
        <circle class="dot" cx="270" cy="-5" r="3"/><text class="client" x="284" y="0">PLE</text>
        <circle class="dot" cx="326" cy="-5" r="3"/><text class="client" x="340" y="0">HLP</text>
        <circle class="dot" cx="390" cy="-5" r="3"/><text class="client" x="404" y="0">FORMA KEY</text>
        <circle class="dot" cx="514" cy="-5" r="3"/><text class="client" x="528" y="0">LA MADELEINE</text>
        <circle class="dot" cx="660" cy="-5" r="3"/><text class="client" x="674" y="0">SAVOR</text>
        <circle class="dot" cx="748" cy="-5" r="3"/><text class="client" x="762" y="0">Abwab Elmansour</text>
      </g>
      <!-- sequence 2, continues -->
      <g transform="translate(980,42)">
        <circle class="dot" cx="-14" cy="-5" r="3"/><text class="client" x="0" y="0">DioRH</text>
        <circle class="dot" cx="76" cy="-5" r="3"/><text class="client" x="90" y="0">AI Crafters</text>
        <circle class="dot" cx="196" cy="-5" r="3"/><text class="client" x="210" y="0">Brain Gen Tech</text>
        <circle class="dot" cx="352" cy="-5" r="3"/><text class="client" x="366" y="0">GEOAP</text>
        <circle class="dot" cx="436" cy="-5" r="3"/><text class="client" x="450" y="0">MMS Mogador</text>
        <circle class="dot" cx="612" cy="-5" r="3"/><text class="client" x="626" y="0">+ more</text>
      </g>
      <!-- sequence 1 repeated for seamless loop -->
      <g transform="translate(1950,42)">
        <circle class="dot" cx="-14" cy="-5" r="3"/><text class="client" x="0" y="0">LE MATIN</text>
        <circle class="dot" cx="126" cy="-5" r="3"/><text class="client" x="140" y="0">CFJJB France</text>
        <circle class="dot" cx="270" cy="-5" r="3"/><text class="client" x="284" y="0">PLE</text>
        <circle class="dot" cx="326" cy="-5" r="3"/><text class="client" x="340" y="0">HLP</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #F1F5F9; }
      .sub   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #94A3B8; }
      .date  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748B; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="260" rx="18" fill="#0B1220"/>

  <line x1="90" y1="130" x2="810" y2="130" stroke="#1E293B" stroke-width="4"/>
  <line x1="90" y1="130" x2="90" y2="130" stroke="#10B981" stroke-width="4">
    <animate attributeName="x2" from="90" to="810" dur="1.6s" fill="freeze" begin="0.1s"/>
  </line>

  <!-- Node 1: DUT -->
  <g>
    <circle cx="150" cy="130" r="9" fill="#10B981"/>
    <text class="date" x="150" y="105" text-anchor="middle">Sep 2021 – Jul 2023</text>
    <text class="title" x="150" y="165" text-anchor="middle">DUT</text>
    <text class="sub" x="150" y="184" text-anchor="middle">Business Intelligence &amp;</text>
    <text class="sub" x="150" y="199" text-anchor="middle">Data Science</text>
    <text class="sub" x="150" y="218" text-anchor="middle" fill="#64748B">EST Essaouira · Cadi Ayyad</text>
  </g>

  <!-- Node 2: Bachelor -->
  <g>
    <circle cx="450" cy="130" r="9" fill="#0EA5E9"/>
    <text class="date" x="450" y="105" text-anchor="middle">Oct 2023 – Jun 2024</text>
    <text class="title" x="450" y="165" text-anchor="middle">Professional Bachelor's</text>
    <text class="sub" x="450" y="184" text-anchor="middle">Computer Systems &amp;</text>
    <text class="sub" x="450" y="199" text-anchor="middle">Software Engineering</text>
    <text class="sub" x="450" y="218" text-anchor="middle" fill="#64748B">EST Essaouira · Cadi Ayyad</text>
  </g>

  <!-- Node 3: Engineer -->
  <g>
    <circle cx="750" cy="130" r="10" fill="#7C3AED"/>
    <circle cx="750" cy="130" r="16" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.6">
      <animate attributeName="r" from="10" to="22" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text class="date" x="750" y="105" text-anchor="middle">Sep 2024 – Present</text>
    <text class="title" x="750" y="165" text-anchor="middle">Engineer's Degree</text>
    <text class="sub" x="750" y="184" text-anchor="middle">AI &amp; Data Science</text>
    <text class="sub" x="750" y="199" text-anchor="middle">(final year)</text>
    <text class="sub" x="750" y="218" text-anchor="middle" fill="#64748B">ENSIASD</text>
  </g>
</svg>

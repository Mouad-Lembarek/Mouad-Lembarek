<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .head  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; }
      .item  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .hub   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #F1F5F9; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="320" rx="18" fill="#0B1220"/>

  <!-- connecting lines -->
  <g stroke="#334155" stroke-width="1.5" opacity="0">
    <line x1="450" y1="160" x2="270" y2="70"/>
    <line x1="450" y1="160" x2="270" y2="130"/>
    <line x1="450" y1="160" x2="270" y2="190"/>
    <line x1="450" y1="160" x2="270" y2="250"/>
    <line x1="450" y1="160" x2="630" y2="70"/>
    <line x1="450" y1="160" x2="630" y2="130"/>
    <line x1="450" y1="160" x2="630" y2="190"/>
    <line x1="450" y1="160" x2="630" y2="250"/>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
  </g>

  <!-- hub -->
  <circle cx="450" cy="160" r="46" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text class="hub" x="450" y="156" text-anchor="middle">Mouad's</text>
  <text class="hub" x="450" y="174" text-anchor="middle">work</text>

  <!-- left lane: Software / AI Engineering -->
  <text class="head" x="270" y="30" text-anchor="middle" fill="#0EA5E9">Software &amp; AI Engineering</text>
  <g>
    <rect x="185" y="55" width="170" height="30" rx="8" fill="#0EA5E9" opacity="0.15"/>
    <text class="item" x="270" y="74" text-anchor="middle">Full-stack development</text>
    <rect x="185" y="115" width="170" height="30" rx="8" fill="#0EA5E9" opacity="0.15"/>
    <text class="item" x="270" y="134" text-anchor="middle">APIs &amp; backend systems</text>
    <rect x="185" y="175" width="170" height="30" rx="8" fill="#0EA5E9" opacity="0.15"/>
    <text class="item" x="270" y="194" text-anchor="middle">Databases &amp; data engineering</text>
    <rect x="185" y="235" width="170" height="30" rx="8" fill="#0EA5E9" opacity="0.15"/>
    <text class="item" x="270" y="254" text-anchor="middle">Cloud &amp; infrastructure</text>
  </g>

  <!-- right lane: Applied / Hard AI Engineering -->
  <text class="head" x="630" y="30" text-anchor="middle" fill="#7C3AED">Applied AI Engineering</text>
  <g>
    <rect x="545" y="55" width="170" height="30" rx="8" fill="#7C3AED" opacity="0.18"/>
    <text class="item" x="630" y="74" text-anchor="middle">LLMs &amp; model integration</text>
    <rect x="545" y="115" width="170" height="30" rx="8" fill="#7C3AED" opacity="0.18"/>
    <text class="item" x="630" y="134" text-anchor="middle">AI agents</text>
    <rect x="545" y="175" width="170" height="30" rx="8" fill="#7C3AED" opacity="0.18"/>
    <text class="item" x="630" y="194" text-anchor="middle">Chatbots</text>
    <rect x="545" y="235" width="170" height="30" rx="8" fill="#7C3AED" opacity="0.18"/>
    <text class="item" x="630" y="254" text-anchor="middle">Automations (n8n)</text>
  </g>
</svg>

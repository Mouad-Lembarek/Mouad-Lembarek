<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .lbl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; fill: #94A3B8; }
      .num { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; fill: #F1F5F9; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="230" rx="18" fill="#0B1220"/>

  <!-- Card 1: +50 Projects -->
  <g transform="translate(130,115)">
    <circle r="78" fill="none" stroke="#1E293B" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="490" to="0" dur="1.6s" fill="freeze" begin="0.1s"/>
    </circle>
    <text class="num" font-size="34" text-anchor="middle" y="10" opacity="0">
      +50
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/>
    </text>
    <text class="lbl" text-anchor="middle" y="112">Projects worked on</text>
  </g>

  <!-- Card 2: 20 Client projects -->
  <g transform="translate(380,115)">
    <circle r="78" fill="none" stroke="#1E293B" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#0EA5E9" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="490" to="61" dur="1.6s" fill="freeze" begin="0.25s"/>
    </circle>
    <text class="num" font-size="34" text-anchor="middle" y="10" opacity="0">
      20
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.15s" fill="freeze"/>
    </text>
    <text class="lbl" text-anchor="middle" y="112">Client projects</text>
  </g>

  <!-- Card 3: +100 Academic projects -->
  <g transform="translate(630,115)">
    <circle r="78" fill="none" stroke="#1E293B" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="490" to="0" dur="1.6s" fill="freeze" begin="0.4s"/>
    </circle>
    <text class="num" font-size="34" text-anchor="middle" y="10" opacity="0">
      +100
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
    </text>
    <text class="lbl" text-anchor="middle" y="112">Academic projects</text>
  </g>
</svg>
